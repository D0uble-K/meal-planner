<!DOCTYPE html>
<html lang="vi" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Hôm Nay Ăn Gì - Family Meal Planner</title>
  
  <!-- Cấu hình PWA & Mobile Web App -->
  <meta name="theme-color" content="#FF6B4A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Hôm Nay Ăn Gì">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <!-- Tailwind CSS & FontAwesome Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#FFF5F2',
              100: '#FFE6E0',
              500: '#FF6B4A',
              600: '#E85536',
              700: '#C23D20'
            }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-h-full flex flex-col bg-gray-50 dark:bg-gray-950 text-gray-800 dark:text-gray-100 antialiased selection:bg-orange-500 selection:text-white">

  <!-- Header cố định đầu trang -->
  <header id="app-header" class="sticky top-0 z-30 bg-white/95 dark:bg-gray-900/95 backdrop-blur-md border-b border-gray-100 dark:border-gray-800 shadow-xs"></header>

  <!-- Nội dung trang chính (SPA Viewport) -->
  <main id="app-main" class="flex-1 max-w-md w-full mx-auto px-4 py-4 pb-safe"></main>

  <!-- Thanh điều hướng đáy (Bottom Navigation) -->
  <nav id="app-navigation" class="fixed bottom-0 left-0 right-0 z-30"></nav>

  <!-- Nạp các Module JavaScript theo thứ tự phụ thuộc -->
  <script src="js/store.js"></script>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
